name: Bootstrap Integration Settings on Vercel

on:
  push:
    branches:
      - agent/secure-integration-settings-backend
    paths:
      - .github/workflows/bootstrap-integration-settings-vercel.yml

permissions:
  contents: read

concurrency:
  group: bootstrap-integration-settings-vercel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/agent/secure-integration-settings-backend'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_NAME: gozbebekleri
      VERCEL_PROJECT_ID: prj_hkMyu8iABc7AAqF7T1DvYRpKYRqV
      VERCEL_TEAM_SCOPE: gozbebekleri-dernek
      VERCEL_TEAM_ID: team_zLLO1Hql8hFDCswcnpMMDCBj
      TARGET_BRANCH: agent/secure-integration-settings-backend

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/secure-integration-settings-backend
          fetch-depth: 1

      - name: Use project Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Bootstrap Vercel safely
        shell: bash
        run: |
          set -Eeuo pipefail

          TMP_DIR="$(mktemp -d)"
          PREVIEW_ENV="$TMP_DIR/preview.env"
          PRODUCTION_ENV="$TMP_DIR/production.env"
          PARSER="$TMP_DIR/env-reader.cjs"
          PREVIEW_URL=""
          BUILD_RESULT="NOT_RUN"
          PREFLIGHT_RESULT="NOT_RUN"
          MIGRATION_RESULT="NOT_RUN"
          TRANSACTIONS_RESULT="TRANSACTIONS_UNVERIFIED"
          DATABASE_RELATION="UNABLE_TO_VERIFY"
          PREVIEW_KEY_STATUS="MISSING"
          PRODUCTION_KEY_STATUS="MISSING"
          DATABASE_STATUS="MISSING"
          CRON_STATUS="MISSING"
          CANONICAL_STATUS="MISSING"
          OVERALL_RESULT="BLOCKED"
          BLOCKER=""
          SUMMARY_WRITTEN=0

          write_summary() {
            {
              echo "# Vercel Integration Settings Bootstrap"
              echo
              echo "| Check | Result |"
              echo "|---|---|"
              echo "| Project | $VERCEL_PROJECT_NAME |"
              echo "| Team | $VERCEL_TEAM_SCOPE |"
              echo "| Database relation | $DATABASE_RELATION |"
              echo "| Preview encryption key | $PREVIEW_KEY_STATUS |"
              echo "| Production encryption key | $PRODUCTION_KEY_STATUS |"
              echo "| DATABASE_URL | $DATABASE_STATUS |"
              echo "| CRON_SECRET | $CRON_STATUS |"
              echo "| Canonical URL | $CANONICAL_STATUS |"
              echo "| Preview deployment | ${PREVIEW_URL:-NOT_CREATED} |"
              echo "| Build | $BUILD_RESULT |"
              echo "| Preflight | $PREFLIGHT_RESULT |"
              echo "| Migration verify | $MIGRATION_RESULT |"
              echo "| MongoDB transactions | $TRANSACTIONS_RESULT |"
              echo "| Overall | $OVERALL_RESULT |"
              if [[ -n "$BLOCKER" ]]; then
                echo "| Blocker | $BLOCKER |"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            SUMMARY_WRITTEN=1
          }

          cleanup() {
            if [[ $SUMMARY_WRITTEN -eq 0 ]]; then
              BLOCKER="UNEXPECTED_WORKFLOW_FAILURE"
              OVERALL_RESULT="BLOCKED"
              write_summary
            fi
            unset PREVIEW_KEY PRODUCTION_KEY GENERATED_KEY
            rm -rf "$TMP_DIR"
            rm -rf "$GITHUB_WORKSPACE/.vercel"
          }
          trap cleanup EXIT

          block() {
            BLOCKER="$1"
            OVERALL_RESULT="BLOCKED"
            write_summary
            exit 1
          }

          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            block "VERCEL_TOKEN_UNAVAILABLE"
          fi

          cat > "$PARSER" <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');

          function parse(file) {
            const out = {};
            const text = fs.readFileSync(file, 'utf8');
            for (const rawLine of text.split(/\r?\n/)) {
              const line = rawLine.trim();
              if (!line || line.startsWith('#')) continue;
              const index = line.indexOf('=');
              if (index < 1) continue;
              const key = line.slice(0, index).trim();
              let value = line.slice(index + 1).trim();
              if (value.startsWith('"') && value.endsWith('"')) {
                try { value = JSON.parse(value); } catch { value = value.slice(1, -1); }
              } else if (value.startsWith("'") && value.endsWith("'")) {
                value = value.slice(1, -1);
              }
              out[key] = value;
            }
            return out;
          }

          const command = process.argv[2];
          if (command === 'get') {
            const values = parse(process.argv[3]);
            process.stdout.write(values[process.argv[4]] || '');
          } else if (command === 'db-relation') {
            const preview = parse(process.argv[3]).DATABASE_URL || '';
            const production = parse(process.argv[4]).DATABASE_URL || '';
            if (!preview || !production) process.stdout.write('UNABLE_TO_VERIFY');
            else {
              const left = crypto.createHash('sha256').update(preview).digest();
              const right = crypto.createHash('sha256').update(production).digest();
              process.stdout.write(left.length === right.length && crypto.timingSafeEqual(left, right) ? 'SAME_DATABASE' : 'DIFFERENT_DATABASE');
            }
          } else if (command === 'key-valid') {
            const value = fs.readFileSync(0, 'utf8').trim();
            let valid = false;
            if (/^[a-fA-F0-9]{64}$/.test(value)) valid = Buffer.from(value, 'hex').length === 32;
            if (!valid) {
              try { valid = Buffer.from(value, 'base64url').length === 32; } catch {}
            }
            if (!valid) {
              try { valid = Buffer.from(value, 'base64').length === 32; } catch {}
            }
            process.stdout.write(valid ? 'VALID' : 'INVALID');
          } else if (command === 'cron-valid') {
            const value = fs.readFileSync(0, 'utf8');
            process.stdout.write(value.trim().length >= 32 && !/[\r\n]/.test(value.trim()) ? 'VALID' : 'INVALID');
          } else if (command === 'canonical-status') {
            const values = parse(process.argv[3]);
            const raw = values.APP_URL || values.NEXTAUTH_URL || values.NEXT_PUBLIC_APP_URL || values.NEXT_PUBLIC_SITE_URL || '';
            if (!raw) process.stdout.write('MISSING');
            else {
              try {
                const url = new URL(raw);
                const production = process.argv[4] === 'production';
                process.stdout.write(production && url.protocol !== 'https:' ? 'INVALID' : 'PRESENT');
              } catch { process.stdout.write('INVALID'); }
            }
          }
          NODE

          vercel whoami --token "$VERCEL_TOKEN" > "$TMP_DIR/whoami.log" 2>&1 || block "VERCEL_AUTHENTICATION_FAILED"
          vercel link --yes --project "$VERCEL_PROJECT_NAME" --scope "$VERCEL_TEAM_SCOPE" --token "$VERCEL_TOKEN" > "$TMP_DIR/link.log" 2>&1 || block "VERCEL_PROJECT_LINK_FAILED"
          vercel project inspect "$VERCEL_PROJECT_NAME" --scope "$VERCEL_TEAM_SCOPE" --token "$VERCEL_TOKEN" > "$TMP_DIR/project.log" 2>&1 || block "VERCEL_PROJECT_INSPECTION_FAILED"
          vercel env ls --scope "$VERCEL_TEAM_SCOPE" --token "$VERCEL_TOKEN" > "$TMP_DIR/env-list.log" 2>&1 || block "VERCEL_ENVIRONMENT_LIST_FAILED"

          if ! node - <<'NODE'
          const fs = require('node:fs');
          const project = JSON.parse(fs.readFileSync('.vercel/project.json', 'utf8'));
          if (project.projectId !== process.env.VERCEL_PROJECT_ID || project.orgId !== process.env.VERCEL_TEAM_ID) process.exit(1);
          NODE
          then
            block "VERCEL_PROJECT_IDENTITY_MISMATCH"
          fi

          vercel env pull "$PREVIEW_ENV" --yes --environment=preview --git-branch="$TARGET_BRANCH" --scope "$VERCEL_TEAM_SCOPE" --token "$VERCEL_TOKEN" > "$TMP_DIR/pull-preview.log" 2>&1 || block "PREVIEW_ENV_PULL_FAILED"
          vercel env pull "$PRODUCTION_ENV" --yes --environment=production --scope "$VERCEL_TEAM_SCOPE" --token "$VERCEL_TOKEN" > "$TMP_DIR/pull-production.log" 2>&1 || block "PRODUCTION_ENV_PULL_FAILED"

          PREVIEW_DB="$(node "$PARSER" get "$PREVIEW_ENV" DATABASE_URL)"
          PRODUCTION_DB="$(node "$PARSER" get "$PRODUCTION_ENV" DATABASE_URL)"
          if [[ -z "$PREVIEW_DB" || -z "$PRODUCTION_DB" ]]; then
            DATABASE_STATUS="MISSING"
            block "DATABASE_URL_MISSING"
          fi
          DATABASE_STATUS="PRESENT"
          DATABASE_RELATION="$(node "$PARSER" db-relation "$PREVIEW_ENV" "$PRODUCTION_ENV")"
          if [[ "$DATABASE_RELATION" == "UNABLE_TO_VERIFY" ]]; then
            block "DATABASE_RELATION_UNVERIFIED"
          fi
          unset PREVIEW_DB PRODUCTION_DB

          PREVIEW_CRON="$(node "$PARSER" get "$PREVIEW_ENV" CRON_SECRET)"
          PRODUCTION_CRON="$(node "$PARSER" get "$PRODUCTION_ENV" CRON_SECRET)"
          if [[ -z "$PREVIEW_CRON" || -z "$PRODUCTION_CRON" ]]; then
            CRON_STATUS="MISSING"
            block "CRON_SECRET_MISSING"
          fi
          if [[ "$(printf '%s' "$PREVIEW_CRON" | node "$PARSER" cron-valid)" != "VALID" || "$(printf '%s' "$PRODUCTION_CRON" | node "$PARSER" cron-valid)" != "VALID" ]]; then
            CRON_STATUS="INVALID"
            block "CRON_SECRET_INVALID"
          fi
          CRON_STATUS="PRESENT"
          unset PREVIEW_CRON PRODUCTION_CRON

          PREVIEW_CANONICAL="$(node "$PARSER" canonical-status "$PREVIEW_ENV" preview)"
          PRODUCTION_CANONICAL="$(node "$PARSER" canonical-status "$PRODUCTION_ENV" production)"
          if [[ "$PREVIEW_CANONICAL" == "MISSING" || "$PRODUCTION_CANONICAL" == "MISSING" ]]; then
            CANONICAL_STATUS="MISSING"
            block "CANONICAL_URL_MISSING"
          fi
          if [[ "$PREVIEW_CANONICAL" == "INVALID" || "$PRODUCTION_CANONICAL" == "INVALID" ]]; then
            CANONICAL_STATUS="INVALID"
            block "CANONICAL_URL_INVALID"
          fi
          CANONICAL_STATUS="PRESENT"

          PREVIEW_KEY="$(node "$PARSER" get "$PREVIEW_ENV" INTEGRATION_SETTINGS_ENCRYPTION_KEY)"
          PRODUCTION_KEY="$(node "$PARSER" get "$PRODUCTION_ENV" INTEGRATION_SETTINGS_ENCRYPTION_KEY)"

          if [[ -n "$PREVIEW_KEY" ]]; then
            PREVIEW_KEY_STATUS="$(printf '%s' "$PREVIEW_KEY" | node "$PARSER" key-valid)"
            [[ "$PREVIEW_KEY_STATUS" == "VALID" ]] || block "PREVIEW_ENCRYPTION_KEY_INVALID"
          fi
          if [[ -n "$PRODUCTION_KEY" ]]; then
            PRODUCTION_KEY_STATUS="$(printf '%s' "$PRODUCTION_KEY" | node "$PARSER" key-valid)"
            [[ "$PRODUCTION_KEY_STATUS" == "VALID" ]] || block "PRODUCTION_ENCRYPTION_KEY_INVALID"
          fi

          if [[ "$DATABASE_RELATION" == "SAME_DATABASE" ]]; then
            if [[ -n "$PREVIEW_KEY" && -n "$PRODUCTION_KEY" ]]; then
              [[ "$PREVIEW_KEY" == "$PRODUCTION_KEY" ]] || block "ENCRYPTION_KEYS_DIFFER_FOR_SHARED_DATABASE"
            elif [[ -n "$PREVIEW_KEY" ]]; then
              printf '%s' "$PREVIEW_KEY" | vercel env add INTEGRATION_SETTINGS_ENCRYPTION_KEY production --sensitive --scope "$VERCEL_TEAM_SCOPE" --token "$VERCEL_TOKEN" > "$TMP_DIR/add-production-key.log" 2>&1 || block "PRODUCTION_ENCRYPTION_KEY_ADD_FAILED"
              PRODUCTION_KEY_STATUS="ADDED"
            elif [[ -n "$PRODUCTION_KEY" ]]; then
              printf '%s' "$PRODUCTION_KEY" | vercel env add INTEGRATION_SETTINGS_ENCRYPTION_KEY preview --git-branch="$TARGET_BRANCH" --sensitive --scope "$VERCEL_TEAM_SCOPE" --token "$VERCEL_TOKEN" > "$TMP_DIR/add-preview-key.log" 2>&1 || block "PREVIEW_ENCRYPTION_KEY_ADD_FAILED"
              PREVIEW_KEY_STATUS="ADDED"
            else
              GENERATED_KEY="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('base64url'))")"
              printf '%s' "$GENERATED_KEY" | vercel env add INTEGRATION_SETTINGS_ENCRYPTION_KEY preview --git-branch="$TARGET_BRANCH" --sensitive --scope "$VERCEL_TEAM_SCOPE" --token "$VERCEL_TOKEN" > "$TMP_DIR/add-preview-key.log" 2>&1 || block "PREVIEW_ENCRYPTION_KEY_ADD_FAILED"
              printf '%s' "$GENERATED_KEY" | vercel env add INTEGRATION_SETTINGS_ENCRYPTION_KEY production --sensitive --scope "$VERCEL_TEAM_SCOPE" --token "$VERCEL_TOKEN" > "$TMP_DIR/add-production-key.log" 2>&1 || block "PRODUCTION_ENCRYPTION_KEY_ADD_FAILED"
              PREVIEW_KEY_STATUS="ADDED"
              PRODUCTION_KEY_STATUS="ADDED"
              unset GENERATED_KEY
            fi
          else
            if [[ -z "$PREVIEW_KEY" ]]; then
              GENERATED_KEY="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('base64url'))")"
              printf '%s' "$GENERATED_KEY" | vercel env add INTEGRATION_SETTINGS_ENCRYPTION_KEY preview --git-branch="$TARGET_BRANCH" --sensitive --scope "$VERCEL_TEAM_SCOPE" --token "$VERCEL_TOKEN" > "$TMP_DIR/add-preview-key.log" 2>&1 || block "PREVIEW_ENCRYPTION_KEY_ADD_FAILED"
              PREVIEW_KEY_STATUS="ADDED"
              unset GENERATED_KEY
            fi
            if [[ -z "$PRODUCTION_KEY" ]]; then
              GENERATED_KEY="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('base64url'))")"
              printf '%s' "$GENERATED_KEY" | vercel env add INTEGRATION_SETTINGS_ENCRYPTION_KEY production --sensitive --scope "$VERCEL_TEAM_SCOPE" --token "$VERCEL_TOKEN" > "$TMP_DIR/add-production-key.log" 2>&1 || block "PRODUCTION_ENCRYPTION_KEY_ADD_FAILED"
              PRODUCTION_KEY_STATUS="ADDED"
              unset GENERATED_KEY
            fi
          fi
          unset PREVIEW_KEY PRODUCTION_KEY

          set +e
          vercel deploy --yes --scope "$VERCEL_TEAM_SCOPE" --token "$VERCEL_TOKEN" > "$TMP_DIR/deploy.log" 2>&1
          DEPLOY_EXIT=$?
          set -e
          if [[ $DEPLOY_EXIT -ne 0 ]]; then
            BUILD_RESULT="FAILED"
            block "PREVIEW_DEPLOYMENT_FAILED"
          fi
          PREVIEW_URL="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' "$TMP_DIR/deploy.log" | tail -n 1 || true)"
          [[ -n "$PREVIEW_URL" ]] || block "PREVIEW_URL_NOT_FOUND"

          vercel inspect "$PREVIEW_URL" --wait --timeout 20m --scope "$VERCEL_TEAM_SCOPE" --token "$VERCEL_TOKEN" > "$TMP_DIR/inspect.log" 2>&1 || block "PREVIEW_NOT_READY"
          BUILD_RESULT="READY"

          set +e
          vercel env run -e preview -- npm run preflight:integration-settings > "$TMP_DIR/preflight.log" 2>&1
          PREFLIGHT_EXIT=$?
          vercel env run -e preview -- npm run verify:integration-settings-migration > "$TMP_DIR/migration-verify.log" 2>&1
          MIGRATION_EXIT=$?
          set -e

          PREFLIGHT_RESULT="$(grep -Eo 'INTEGRATION SETTINGS PREFLIGHT: (PASS|WARNING|BLOCKED)' "$TMP_DIR/preflight.log" | tail -n 1 | awk '{print $4}' || true)"
          [[ -n "$PREFLIGHT_RESULT" ]] || PREFLIGHT_RESULT="BLOCKED"
          MIGRATION_RESULT="$(grep -Eo 'MIGRATION STATUS: (FULLY_APPLIED|PARTIALLY_APPLIED|NOT_APPLIED|UNKNOWN)' "$TMP_DIR/migration-verify.log" | tail -n 1 | awk '{print $3}' || true)"
          [[ -n "$MIGRATION_RESULT" ]] || MIGRATION_RESULT="UNKNOWN"

          if grep -q '^\[PASS\] transactions:' "$TMP_DIR/preflight.log"; then
            TRANSACTIONS_RESULT="SUPPORTED"
          else
            TRANSACTIONS_RESULT="TRANSACTIONS_UNVERIFIED"
          fi

          if [[ $PREFLIGHT_EXIT -ne 0 || "$PREFLIGHT_RESULT" == "BLOCKED" ]]; then
            block "PREFLIGHT_BLOCKED"
          fi
          if [[ $MIGRATION_EXIT -ne 0 || "$MIGRATION_RESULT" == "UNKNOWN" ]]; then
            block "MIGRATION_VERIFY_BLOCKED"
          fi

          if [[ "$PREFLIGHT_RESULT" == "WARNING" || "$TRANSACTIONS_RESULT" == "TRANSACTIONS_UNVERIFIED" || "$MIGRATION_RESULT" != "FULLY_APPLIED" ]]; then
            OVERALL_RESULT="WARNING"
          else
            OVERALL_RESULT="PASS"
          fi
          write_summary
