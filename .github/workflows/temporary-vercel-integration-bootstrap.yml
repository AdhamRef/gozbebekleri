name: Temporary Vercel integration bootstrap
on:
  workflow_dispatch:
  issue_comment:
    types: [created]
concurrency:
  group: temporary-vercel-integration-bootstrap
  cancel-in-progress: false
env:
  EXPECTED_TARGET_SHA: 5409833f6ec1276124275d1d4ae11d7f7429039b
  TARGET_BRANCH: agent/secure-integration-settings-backend
  VERCEL_PROJECT_NAME: gozbebekleri
  VERCEL_PROJECT_ID: prj_hkMyu8iABc7AAqF7T1DvYRpKYRqV
  VERCEL_TEAM_SCOPE: gozbebekleri-dernek
  VERCEL_TEAM_ID: team_zLLO1Hql8hFDCswcnpMMDCBj
jobs:
  repair_lockfile:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 127 &&
       github.event.comment.body == '/run-pr127-repair-final-20260715' &&
       github.actor == 'saladin76')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    outputs:
      result: ${{ steps.repair.outputs.result }}
      old_sha: ${{ steps.repair.outputs.old_sha }}
      new_sha: ${{ steps.repair.outputs.new_sha }}
      additions: ${{ steps.repair.outputs.additions }}
      deletions: ${{ steps.repair.outputs.deletions }}
      npm_ci: ${{ steps.repair.outputs.npm_ci }}
      tests: ${{ steps.repair.outputs.tests }}
      prisma_default: ${{ steps.repair.outputs.prisma_default }}
      prisma_integration: ${{ steps.repair.outputs.prisma_integration }}
      runtime_typecheck: ${{ steps.repair.outputs.runtime_typecheck }}
      release_typecheck: ${{ steps.repair.outputs.release_typecheck }}
      node_version: ${{ steps.repair.outputs.node_version }}
      npm_version: ${{ steps.repair.outputs.npm_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: npm_tool
        shell: bash
        run: |
          set -Eeuo pipefail
          tool="$RUNNER_TEMP/npm-tool"
          npm install --prefix "$tool" npm@10.9.2 --ignore-scripts --no-audit --no-fund
          cat > "$RUNNER_TEMP/npm10" <<'SH'
          #!/usr/bin/env bash
          exec node "$RUNNER_TEMP/npm-tool/node_modules/npm/bin/npm-cli.js" "$@"
          SH
          chmod +x "$RUNNER_TEMP/npm10"
          test "$("$RUNNER_TEMP/npm10" --version)" = 10.9.2
          echo "NPM10=$RUNNER_TEMP/npm10" >> "$GITHUB_ENV"
      - id: repair
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +x
          set -Eeuo pipefail
          old_sha="$(git rev-parse HEAD)"
          node_version="$(node --version)"
          npm_version="$("$NPM10" --version)"
          [[ "$old_sha" == "$EXPECTED_TARGET_SHA" ]]
          [[ "$node_version" =~ ^v22\. ]]
          [[ "$npm_version" == 10.9.2 ]]
          cp package.json "$RUNNER_TEMP/package.json.before"
          node - <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          const s=x=>JSON.stringify(Object.fromEntries(Object.entries(x||{}).sort(([a],[b])=>a.localeCompare(b))));
          fs.writeFileSync(process.env.RUNNER_TEMP+'/deps.before',s(p.dependencies));
          fs.writeFileSync(process.env.RUNNER_TEMP+'/devdeps.before',s(p.devDependencies));
          NODE
          "$NPM10" install --package-lock-only --force --ignore-scripts --no-audit --no-fund
          cmp -s package.json "$RUNNER_TEMP/package.json.before"
          mapfile -t changed < <(git diff --name-only)
          [[ ${#changed[@]} -eq 1 && "${changed[0]}" == package-lock.json ]]
          node - <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          const l=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const s=x=>JSON.stringify(Object.fromEntries(Object.entries(x||{}).sort(([a],[b])=>a.localeCompare(b))));
          if(l.lockfileVersion!==3) throw Error('LOCKFILE_VERSION');
          const r=l.packages?.['']; if(!r) throw Error('ROOT_MISSING');
          if(s(r.dependencies)!==s(p.dependencies)||s(r.devDependencies)!==s(p.devDependencies)) throw Error('ROOT_MISMATCH');
          if(s(p.dependencies)!==fs.readFileSync(process.env.RUNNER_TEMP+'/deps.before','utf8')) throw Error('DIRECT_DEPENDENCIES_CHANGED');
          if(s(p.devDependencies)!==fs.readFileSync(process.env.RUNNER_TEMP+'/devdeps.before','utf8')) throw Error('DIRECT_DEV_DEPENDENCIES_CHANGED');
          for(const v of Object.values(l.packages||{})) if(v?.resolved){const u=new URL(String(v.resolved));if(u.protocol!=='https:'||u.hostname!=='registry.npmjs.org'||u.username||u.password)throw Error('REGISTRY_URL');}
          if(/(_authToken|x-access-token|authorization\s*["']?\s*:|Bearer\s+[A-Za-z0-9._~-]+|npm_[A-Za-z0-9]{20,})/i.test(fs.readFileSync('package-lock.json','utf8')))throw Error('CREDENTIAL_CONTENT');
          NODE
          read -r additions deletions _ < <(git diff --numstat -- package-lock.json)
          rm -rf node_modules
          "$NPM10" ci --force --no-audit --no-fund
          npm_ci=success
          "$NPM10" run test:integration-settings
          tests=success
          ./node_modules/.bin/prisma generate
          prisma_default=success
          ./node_modules/.bin/prisma generate --schema prisma/integration-settings.schema.prisma
          prisma_integration=success
          "$NPM10" run typecheck:communication-runtime
          runtime_typecheck=success
          "$NPM10" run typecheck:integration-release
          release_typecheck=success
          cmp -s package.json "$RUNNER_TEMP/package.json.before"
          mapfile -t changed < <(git diff --name-only)
          [[ ${#changed[@]} -eq 1 && "${changed[0]}" == package-lock.json ]]
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          git commit -m 'Repair package lock consistency'
          new_sha="$(git rev-parse HEAD)"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          header="AUTHORIZATION: basic $auth"
          git -c http.https://github.com/.extraheader="$header" fetch origin "$TARGET_BRANCH" --no-tags
          [[ "$(git rev-parse FETCH_HEAD)" == "$EXPECTED_TARGET_SHA" ]]
          git -c http.https://github.com/.extraheader="$header" push origin "HEAD:refs/heads/$TARGET_BRANCH"
          {
            echo result=success
            echo old_sha="$old_sha"
            echo new_sha="$new_sha"
            echo additions="${additions:-0}"
            echo deletions="${deletions:-0}"
            echo npm_ci="$npm_ci"
            echo tests="$tests"
            echo prisma_default="$prisma_default"
            echo prisma_integration="$prisma_integration"
            echo runtime_typecheck="$runtime_typecheck"
            echo release_typecheck="$release_typecheck"
            echo node_version="$node_version"
            echo npm_version="$npm_version"
          } >> "$GITHUB_OUTPUT"
  bootstrap:
    if: always() && needs.repair_lockfile.result == 'success'
    needs: repair_lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      TARGET_COMMIT_SHA: ${{ needs.repair_lockfile.outputs.new_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_COMMIT_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: npm_tool
        shell: bash
        run: |
          set -Eeuo pipefail
          tool="$RUNNER_TEMP/npm-tool"
          npm install --prefix "$tool" npm@10.9.2 --ignore-scripts --no-audit --no-fund
          cat > "$RUNNER_TEMP/npm10" <<'SH'
          #!/usr/bin/env bash
          exec node "$RUNNER_TEMP/npm-tool/node_modules/npm/bin/npm-cli.js" "$@"
          SH
          chmod +x "$RUNNER_TEMP/npm10"
          echo "NPM10=$RUNNER_TEMP/npm10" >> "$GITHUB_ENV"
      - run: '"$NPM10" ci --force --no-audit --no-fund'
      - run: '"$NPM10" install --global vercel@56.1.0 --no-audit --no-fund'
      - id: preview
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set +x
          set -Eeuo pipefail
          response="$RUNNER_TEMP/deployments.json"
          for _ in $(seq 1 80); do
            curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_TEAM_ID&limit=20&target=preview" > "$response"
            line="$(node - "$response" "$TARGET_COMMIT_SHA" "$TARGET_BRANCH" <<'NODE'
          const fs=require('node:fs');const [f,s,b]=process.argv.slice(2);const x=JSON.parse(fs.readFileSync(f,'utf8'));const d=(x.deployments||[]).filter(v=>v?.meta?.githubCommitSha===s&&v?.meta?.githubCommitRef===b).sort((a,z)=>Number(z.created||z.createdAt||0)-Number(a.created||a.createdAt||0))[0];if(!d)process.exit(2);process.stdout.write(`${d.uid||d.id}\t${d.readyState||d.state||'UNKNOWN'}`);
          NODE
          )" || true
            if [[ -n "$line" ]]; then
              IFS=$'\t' read -r id state <<< "$line"
              if [[ "$state" == READY ]]; then echo "id=$id" >> "$GITHUB_OUTPUT"; echo state=READY >> "$GITHUB_OUTPUT"; exit 0; fi
              if [[ "$state" == ERROR || "$state" == CANCELED ]]; then echo "id=$id" >> "$GITHUB_OUTPUT"; echo "state=$state" >> "$GITHUB_OUTPUT"; exit 1; fi
            fi
            sleep 15
          done
          echo state=TIMEOUT >> "$GITHUB_OUTPUT"
          exit 1
      - id: bootstrap
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SAFE_REPORT: ${{ runner.temp }}/vercel.md
        run: bash scripts/bootstrap-integration-settings-vercel-ci.sh
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          report="$RUNNER_TEMP/report.md"
          {
            echo '## Final PR127 lockfile repair and Vercel gate'
            echo
            echo '| Check | Result |'
            echo '|---|---|'
            echo '| GitHub deterministic checks | PASS |'
            echo "| Old SHA | ${{ needs.repair_lockfile.outputs.old_sha }} |"
            echo "| New SHA | ${{ needs.repair_lockfile.outputs.new_sha }} |"
            echo "| package-lock additions | ${{ needs.repair_lockfile.outputs.additions }} |"
            echo "| package-lock deletions | ${{ needs.repair_lockfile.outputs.deletions }} |"
            echo '| package.json changed | false |'
            echo '| Direct dependencies changed | false |'
            echo "| npm ci | ${{ needs.repair_lockfile.outputs.npm_ci }} |"
            echo "| Integration tests | ${{ needs.repair_lockfile.outputs.tests }} |"
            echo "| Default Prisma generation | ${{ needs.repair_lockfile.outputs.prisma_default }} |"
            echo "| Integration Prisma generation | ${{ needs.repair_lockfile.outputs.prisma_integration }} |"
            echo "| Runtime typecheck | ${{ needs.repair_lockfile.outputs.runtime_typecheck }} |"
            echo "| Release typecheck | ${{ needs.repair_lockfile.outputs.release_typecheck }} |"
            echo '| GitHub npm run build | NOT_RUN_BY_DESIGN |'
            echo "| Vercel Preview ID | ${{ steps.preview.outputs.id }} |"
            echo "| Vercel production build gate | ${{ steps.preview.outputs.state }} |"
          } > "$report"
          if [[ -f "$RUNNER_TEMP/vercel.md" ]]; then tail -n +5 "$RUNNER_TEMP/vercel.md" >> "$report"; fi
          gh pr comment 127 --repo AdhamRef/gozbebekleri --body-file "$report"
