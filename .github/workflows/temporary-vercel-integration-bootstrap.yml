name: Temporary Vercel integration bootstrap
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/temporary-vercel-integration-bootstrap.yml]
concurrency: {group: temporary-vercel-integration-bootstrap, cancel-in-progress: false}
env:
  EXPECTED_TARGET_SHA: 4df82817f55e146a150b7b479124f700e0cdf488
  TARGET_BRANCH: agent/secure-integration-settings-backend
  VERCEL_PROJECT_NAME: gozbebekleri
  VERCEL_PROJECT_ID: prj_hkMyu8iABc7AAqF7T1DvYRpKYRqV
  VERCEL_TEAM_SCOPE: gozbebekleri-dernek
  VERCEL_TEAM_ID: team_zLLO1Hql8hFDCswcnpMMDCBj
jobs:
  repair_lockfile:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'Trigger temporary Vercel integration bootstrap'))
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions: {contents: write}
    outputs:
      result: ${{ steps.finalize.outputs.result }}
      blocker: ${{ steps.finalize.outputs.blocker }}
      failed_step: ${{ steps.finalize.outputs.failed_step }}
      old_sha: ${{ steps.finalize.outputs.old_sha }}
      new_target_sha: ${{ steps.finalize.outputs.new_sha }}
      additions: ${{ steps.finalize.outputs.additions }}
      deletions: ${{ steps.finalize.outputs.deletions }}
      package_json_changed: ${{ steps.finalize.outputs.package_json_changed }}
      direct_dependencies_changed: ${{ steps.finalize.outputs.direct_dependencies_changed }}
      npm_ci: ${{ steps.finalize.outputs.npm_ci }}
      tests: ${{ steps.finalize.outputs.tests }}
      prisma_default: ${{ steps.finalize.outputs.prisma_default }}
      prisma_integration: ${{ steps.finalize.outputs.prisma_integration }}
      runtime_typecheck: ${{ steps.finalize.outputs.runtime_typecheck }}
      release_typecheck: ${{ steps.finalize.outputs.release_typecheck }}
      build: ${{ steps.finalize.outputs.build }}
      push: ${{ steps.finalize.outputs.push }}
      ts_errors_b64: ${{ steps.finalize.outputs.ts_errors_b64 }}
    steps:
      - id: checkout
        uses: actions/checkout@v4
        with: {ref: agent/secure-integration-settings-backend, fetch-depth: 0, persist-credentials: false}
      - id: setup_node
        uses: actions/setup-node@v4
        with: {node-version: 22}
      - id: pin_npm
        run: npm install --global npm@10.9.2 --no-audit --no-fund && test "$(npm --version)" = 10.9.2
      - id: verify_head
        shell: bash
        run: |
          S="$RUNNER_TEMP/s";mkdir -p "$S";SHA="$(git rev-parse HEAD)";echo "$SHA">"$S/old_sha"
          [[ "$SHA" == "$EXPECTED_TARGET_SHA" ]]||{ echo TARGET_BRANCH_MOVED>"$S/blocker";echo verify_head>"$S/failed_step";exit 1; }
      - id: repair
        shell: bash
        run: |
          set -Eeuo pipefail;S="$RUNNER_TEMP/s";L="$RUNNER_TEMP/x.log";P="$S/package.json.before";mkdir -p "$S";trap 'rm -f "$L"' EXIT
          fail(){ echo "$1">"$S/blocker";echo "${2:-repair}">"$S/failed_step";exit 1; }
          run(){ local n="$1" b="$2";shift 2;"$@">"$L" 2>&1||fail "$b" "$n";echo success>"$S/$n"; }
          ts(){ node - "$L" "$S/ts.md" <<'NODE'
          const f=require('fs'),[i,o]=process.argv.slice(2),r=[];const x=s=>String(s).replace(/https?:\/\/\S+/gi,'[URL_REDACTED]').replace(/((?:token|secret|password|authorization|database_url|cron_secret|encryption_key)\s*[:=]\s*)\S+/gi,'$1[REDACTED]').replace(/[|`]/g,"'").slice(0,400);for(const l of f.readFileSync(i,'utf8').split(/\r?\n/)){let m=l.match(/^(.*)\((\d+),(\d+)\): error (TS\d+): (.*)$/)||l.match(/^(.*):(\d+):(\d+)\s+-\s+error (TS\d+): (.*)$/);if(m){r.push(`| ${x(m[1])} | ${m[2]} | ${m[4]} | ${x(m[5])} |`);if(r.length===20)break}}f.writeFileSync(o,(r.length?r:['| UNAVAILABLE | UNAVAILABLE | UNAVAILABLE | Sanitized TypeScript details were not available. |']).join('\n')+'\n');
          NODE
          }
          cp package.json "$P";node - <<'NODE'
          const f=require('fs'),p=JSON.parse(f.readFileSync('package.json')),s=x=>JSON.stringify(Object.fromEntries(Object.entries(x||{}).sort(([a],[b])=>a.localeCompare(b))));f.writeFileSync(process.env.RUNNER_TEMP+'/d',s(p.dependencies));f.writeFileSync(process.env.RUNNER_TEMP+'/v',s(p.devDependencies));
          NODE
          npm install --package-lock-only --force --ignore-scripts --no-audit --no-fund>"$L" 2>&1||fail LOCKFILE_REPAIR_FAILED
          cmp -s package.json "$P"||{ echo true>"$S/package_json_changed";fail PACKAGE_JSON_CHANGED; };echo false>"$S/package_json_changed"
          mapfile -t C < <(git diff --name-only);[[ ${#C[@]} -eq 1 && "${C[0]}" == package-lock.json ]]||fail UNEXPECTED_CHANGED_FILES
          V="$(node - <<'NODE' 2>&1
          const f=require('fs'),p=JSON.parse(f.readFileSync('package.json')),l=JSON.parse(f.readFileSync('package-lock.json')),s=x=>JSON.stringify(Object.fromEntries(Object.entries(x||{}).sort(([a],[b])=>a.localeCompare(b))));if(l.lockfileVersion!==3)throw Error('LOCKFILE_VERSION_INVALID');const r=l.packages?.[''];if(!r)throw Error('LOCKFILE_ROOT_MISSING');if(s(r.dependencies)!==s(p.dependencies)||s(r.devDependencies)!==s(p.devDependencies))throw Error('ROOT_DEPENDENCY_RANGES_MISMATCH');if(s(p.dependencies)!==f.readFileSync(process.env.RUNNER_TEMP+'/d','utf8')||s(p.devDependencies)!==f.readFileSync(process.env.RUNNER_TEMP+'/v','utf8'))throw Error('DIRECT_DEPENDENCIES_CHANGED');for(const[k,v]of Object.entries(l.packages||{}))if(v?.resolved){let u;try{u=new URL(String(v.resolved))}catch{throw Error('NON_NPM_REGISTRY_URL')}if(u.protocol!=='https:'||u.hostname!=='registry.npmjs.org'||u.username||u.password)throw Error('NON_NPM_REGISTRY_URL')}if(/(_authToken|x-access-token|authorization\s*["']?\s*:|Bearer\s+[A-Za-z0-9._~-]+|npm_[A-Za-z0-9]{20,})/i.test(f.readFileSync('package-lock.json','utf8')))throw Error('CREDENTIAL_CONTENT_DETECTED');process.stdout.write('OK');
          NODE
          )"||true;[[ "$V" == OK ]]||fail "${V##*Error: }";echo false>"$S/direct_dependencies_changed"
          read -r A D _ < <(git diff --numstat -- package-lock.json);echo "${A:-0}">"$S/additions";echo "${D:-0}">"$S/deletions"
          rm -rf node_modules;run npm_ci NPM_CI_FAILED npm ci --force --no-audit --no-fund;run tests INTEGRATION_TESTS_FAILED npm run test:integration-settings;run prisma_default PRISMA_DEFAULT_GENERATION_FAILED npx prisma generate;run prisma_integration PRISMA_INTEGRATION_GENERATION_FAILED npx prisma generate --schema prisma/integration-settings.schema.prisma
          npm run typecheck:communication-runtime>"$L" 2>&1||{ ts;fail RUNTIME_TYPECHECK_FAILED runtime_typecheck; };echo success>"$S/runtime_typecheck"
          npm run typecheck:integration-release>"$L" 2>&1||{ ts;fail RELEASE_TYPECHECK_FAILED release_typecheck; };echo success>"$S/release_typecheck";run build BUILD_FAILED npm run build
          cmp -s package.json "$P"||fail PACKAGE_JSON_CHANGED_AFTER_CHECKS commit;mapfile -t C < <(git diff --name-only);[[ ${#C[@]} -eq 1 && "${C[0]}" == package-lock.json ]]||fail UNEXPECTED_CHANGED_FILES_AFTER_CHECKS commit
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git add package-lock.json;git commit -m 'Repair package lock consistency'>/dev/null||fail LOCKFILE_COMMIT_FAILED commit;git rev-parse HEAD>"$S/new_sha"
      - id: push
        if: steps.repair.outcome == 'success'
        continue-on-error: true
        shell: bash
        env: {GITHUB_TOKEN: '${{ github.token }}'}
        run: |
          set +x;set -Eeuo pipefail;S="$RUNNER_TEMP/s";L="$RUNNER_TEMP/p.log";trap 'rm -f "$L"' EXIT;A="$(printf 'x-access-token:%s' "$GITHUB_TOKEN"|base64 -w0)";H="AUTHORIZATION: basic $A"
          git -c http.https://github.com/.extraheader="$H" fetch origin "$TARGET_BRANCH" --no-tags>"$L" 2>&1||{ echo PR127_BRANCH_PUSH_BLOCKED>"$S/blocker";echo push>"$S/failed_step";exit 1; };[[ "$(git rev-parse FETCH_HEAD)" == "$EXPECTED_TARGET_SHA" ]]||{ echo TARGET_BRANCH_MOVED>"$S/blocker";echo push>"$S/failed_step";exit 1; };git -c http.https://github.com/.extraheader="$H" push origin "HEAD:refs/heads/$TARGET_BRANCH">"$L" 2>&1||{ echo PR127_BRANCH_PUSH_BLOCKED>"$S/blocker";echo push>"$S/failed_step";exit 1; };echo success>"$S/push"
      - id: finalize
        if: always()
        shell: bash
        run: |
          S="$RUNNER_TEMP/s";mkdir -p "$S";v(){ cat "$S/$1" 2>/dev/null||printf '%s' "$2"; };B="$(v blocker '')";F="$(v failed_step '')";N="$(v new_sha '')";R=blocked;[[ "${{ steps.push.outcome }}" == success && -n "$N" && -z "$B" ]]&&{ R=success;B=NONE;F=NONE; };[[ -n "$B" ]]||{ B=UNKNOWN_REPAIR_FAILURE;F=UNKNOWN; };T='';[[ -s "$S/ts.md" ]]&&T="$(base64 -w0<"$S/ts.md")";{ echo result=$R;echo blocker=$B;echo failed_step=$F;echo old_sha="$(v old_sha UNAVAILABLE)";echo new_sha=$N;echo additions="$(v additions 0)";echo deletions="$(v deletions 0)";echo package_json_changed="$(v package_json_changed UNVERIFIED)";echo direct_dependencies_changed="$(v direct_dependencies_changed UNVERIFIED)";echo npm_ci="$(v npm_ci skipped)";echo tests="$(v tests skipped)";echo prisma_default="$(v prisma_default skipped)";echo prisma_integration="$(v prisma_integration skipped)";echo runtime_typecheck="$(v runtime_typecheck skipped)";echo release_typecheck="$(v release_typecheck skipped)";echo build="$(v build skipped)";echo push="$(v push '${{ steps.push.outcome }}')";echo ts_errors_b64=$T; }>>"$GITHUB_OUTPUT";rm -f "$RUNNER_TEMP"/*.log
      - if: always() && steps.finalize.outputs.result != 'success'
        run: exit 1
  bootstrap:
    if: >
      always() &&
      needs.repair_lockfile.result != 'skipped'
    needs: repair_lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: {contents: read, issues: write, pull-requests: write}
    env:
      TARGET_COMMIT_SHA: ${{ needs.repair_lockfile.outputs.new_target_sha }}
      REPAIR_RESULT: ${{ needs.repair_lockfile.outputs.result }}
      REPAIR_BLOCKER: ${{ needs.repair_lockfile.outputs.blocker }}
      REPAIR_FAILED_STEP: ${{ needs.repair_lockfile.outputs.failed_step }}
      OLD_SHA: ${{ needs.repair_lockfile.outputs.old_sha }}
      ADDITIONS: ${{ needs.repair_lockfile.outputs.additions }}
      DELETIONS: ${{ needs.repair_lockfile.outputs.deletions }}
      PACKAGE_JSON_CHANGED: ${{ needs.repair_lockfile.outputs.package_json_changed }}
      DIRECT_DEPENDENCIES_CHANGED: ${{ needs.repair_lockfile.outputs.direct_dependencies_changed }}
      REPAIR_NPM_CI: ${{ needs.repair_lockfile.outputs.npm_ci }}
      REPAIR_TESTS: ${{ needs.repair_lockfile.outputs.tests }}
      REPAIR_PRISMA_DEFAULT: ${{ needs.repair_lockfile.outputs.prisma_default }}
      REPAIR_PRISMA_INTEGRATION: ${{ needs.repair_lockfile.outputs.prisma_integration }}
      REPAIR_RUNTIME_TYPECHECK: ${{ needs.repair_lockfile.outputs.runtime_typecheck }}
      REPAIR_RELEASE_TYPECHECK: ${{ needs.repair_lockfile.outputs.release_typecheck }}
      REPAIR_BUILD: ${{ needs.repair_lockfile.outputs.build }}
      REPAIR_PUSH: ${{ needs.repair_lockfile.outputs.push }}
      TS_ERRORS_B64: ${{ needs.repair_lockfile.outputs.ts_errors_b64 }}
    steps:
      - id: checkout
        if: env.REPAIR_RESULT == 'success'
        uses: actions/checkout@v4
        with: {ref: '${{ env.TARGET_COMMIT_SHA }}', fetch-depth: 1, persist-credentials: false}
      - id: setup_node
        if: steps.checkout.outcome == 'success'
        uses: actions/setup-node@v4
        with: {node-version: 22}
      - id: pin_npm
        if: steps.setup_node.outcome == 'success'
        run: npm install --global npm@10.9.2 --no-audit --no-fund && test "$(npm --version)" = 10.9.2
      - id: npm_ci
        if: steps.pin_npm.outcome == 'success'
        run: npm ci --force --no-audit --no-fund
      - id: vercel
        if: steps.npm_ci.outcome == 'success'
        run: npm install --global vercel@56.1.0 --no-audit --no-fund
      - id: bootstrap
        if: steps.vercel.outcome == 'success'
        continue-on-error: true
        env: {VERCEL_TOKEN: '${{ secrets.VERCEL_TOKEN }}', SAFE_REPORT: '${{ runner.temp }}/vercel.md'}
        run: bash scripts/bootstrap-integration-settings-vercel-ci.sh
      - id: finalize
        if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          V="$RUNNER_TEMP/vercel.md";O="$RUNNER_TEMP/report.md";{ echo '## Temporary Vercel integration bootstrap';echo;echo '| Check | Result |';echo '|---|---|';echo "| Repair lockfile | ${REPAIR_RESULT:-blocked} |";echo "| Failed step | ${REPAIR_FAILED_STEP:-UNKNOWN} |";echo "| Blocker classification | ${REPAIR_BLOCKER:-UNKNOWN_REPAIR_FAILURE} |";echo "| Old PR 127 SHA | ${OLD_SHA:-UNAVAILABLE} |";echo "| New PR 127 SHA | ${TARGET_COMMIT_SHA:-NOT_CREATED} |";echo "| package-lock additions | ${ADDITIONS:-0} |";echo "| package-lock deletions | ${DELETIONS:-0} |";echo "| package.json changed | ${PACKAGE_JSON_CHANGED:-UNVERIFIED} |";echo "| Direct dependencies changed | ${DIRECT_DEPENDENCIES_CHANGED:-UNVERIFIED} |";echo "| Repair npm ci | ${REPAIR_NPM_CI:-skipped} |";echo "| Integration tests | ${REPAIR_TESTS:-skipped} |";echo "| Default Prisma generation | ${REPAIR_PRISMA_DEFAULT:-skipped} |";echo "| Integration Prisma generation | ${REPAIR_PRISMA_INTEGRATION:-skipped} |";echo "| Runtime typecheck | ${REPAIR_RUNTIME_TYPECHECK:-skipped} |";echo "| Release typecheck | ${REPAIR_RELEASE_TYPECHECK:-skipped} |";echo "| Build | ${REPAIR_BUILD:-skipped} |";echo "| Push to PR 127 | ${REPAIR_PUSH:-skipped} |";echo "| Bootstrap checkout | ${{ steps.checkout.outcome }} |";echo "| Bootstrap npm ci | ${{ steps.npm_ci.outcome }} |";echo "| Install Vercel CLI | ${{ steps.vercel.outcome }} |";echo "| Bootstrap | ${{ steps.bootstrap.outcome }} |"; } >"$O";if [[ -n "${TS_ERRORS_B64:-}" ]];then { echo;echo '### Sanitized TypeScript errors';echo;echo '| File | Line | Code | Message |';echo '|---|---:|---|---|'; }>>"$O";printf '%s' "$TS_ERRORS_B64"|base64 -d>>"$O";fi;if [[ -f "$V" ]];then tail -n +5 "$V">>"$O";else printf '%s\n' '| Database relation | UNVERIFIED |' '| Preview encryption key | UNVERIFIED |' '| Production encryption key | UNVERIFIED |' '| DATABASE_URL | UNVERIFIED |' '| CRON_SECRET | UNVERIFIED |' '| Canonical URL | UNVERIFIED |' '| Preview deployment | NOT_REACHED |' '| Preflight | NOT_RUN |' '| Migration verify | NOT_RUN |' '| MongoDB transactions | UNVERIFIED |'>>"$O";fi;gh pr comment 127 --repo AdhamRef/gozbebekleri --body-file "$O">/dev/null
      - if: always() && (env.REPAIR_RESULT != 'success' || steps.bootstrap.outcome != 'success')
        run: exit 1
