name: Temporary Vercel integration bootstrap

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-vercel-integration-bootstrap.yml

concurrency:
  group: temporary-vercel-integration-bootstrap
  cancel-in-progress: false

env:
  EXPECTED_TARGET_SHA: efa9b52380c6ca901ebc8d18ea0ee36768faedc0
  TARGET_BRANCH: agent/secure-integration-settings-backend
  VERCEL_PROJECT_NAME: gozbebekleri
  VERCEL_PROJECT_ID: prj_hkMyu8iABc7AAqF7T1DvYRpKYRqV
  VERCEL_TEAM_SCOPE: gozbebekleri-dernek
  VERCEL_TEAM_ID: team_zLLO1Hql8hFDCswcnpMMDCBj

jobs:
  repair_lockfile:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        startsWith(
          github.event.head_commit.message,
          'Trigger final PR127 lockfile repair'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - id: checkout
        name: Checkout target branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +x
          set -Eeuo pipefail

          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
         