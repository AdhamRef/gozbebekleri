name: Temporary Vercel integration bootstrap

on:
  workflow_dispatch:
  deployment_status:

concurrency:
  group: temporary-vercel-integration-bootstrap
  cancel-in-progress: false

env:
  EXPECTED_TARGET_SHA: 5409833f6ec1276124275d1d4ae11d7f7429039b
  TARGET_BRANCH: agent/secure-integration-settings-backend
  VERCEL_PROJECT_NAME: gozbebekleri
  VERCEL_PROJECT_ID: prj_hkMyu8iABc7AAqF7T1DvYRpKYRqV
  VERCEL_TEAM_SCOPE: gozbebekleri-dernek
  VERCEL_TEAM_ID: team_zLLO1Hql8hFDCswcnpMMDCBj

jobs:
  repair_lockfile:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'deployment_status' &&
        github.event.deployment_status.state == 'success' &&
        (
          github.event.deployment.environment == 'Production' ||
          github.event.deployment.environment == 'production'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify PR 127 safety gates before npm
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +x
          set -Eeuo pipefail
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/AdhamRef/gozbebekleri/pulls/127 > "$RUNNER_TEMP/pr.json"
          python3 - "$RUNNER_TEMP/pr.json" "$TARGET_BRANCH" "$EXPECTED_TARGET_SHA" <<'PY'
          import json, subprocess, sys
          p=json.load(open(sys.argv[1],encoding='utf-8')); branch=sys.argv[2]; sha=sys.argv[3]
          local=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          ok=p.get('state')=='open' and p.get('draft') is True and p['head']['ref']==branch and p['head']['sha']==sha and local==sha
          if not ok:
              print('TARGET_BRANCH_MOVED'); raise SystemExit(1)
          print('PR127_SAFETY_GATE_PASS')
          PY
          rm -f "$RUNNER_TEMP/pr.json"

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pin npm 10.9.2
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --prefix "$RUNNER_TEMP/npm-tool" npm@10.9.2 --ignore-scripts --no-audit --no-fund
          cat > "$RUNNER_TEMP/npm10" <<'SH'
          #!/usr/bin/env bash
          exec node "$RUNNER_TEMP/npm-tool/node_modules/npm/bin/npm-cli.js" "$@"
          SH
          chmod +x "$RUNNER_TEMP/npm10"
          test "$("$RUNNER_TEMP/npm10" --version)" = 10.9.2
          echo "NPM10=$RUNNER_TEMP/npm10" >> "$GITHUB_ENV"

      - id: repair
        name: Repair, verify and push package lock
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +x
          set -Eeuo pipefail
          old_sha="$(git rev-parse HEAD)"; test "$old_sha" = "$EXPECTED_TARGET_SHA"
          cp package.json "$RUNNER_TEMP/package.before"
          node - <<'NODE'
          const f=require('fs'),p=JSON.parse(f.readFileSync('package.json')),s=x=>JSON.stringify(Object.fromEntries(Object.entries(x||{}).sort(([a],[b])=>a.localeCompare(b))));f.writeFileSync(process.env.RUNNER_TEMP+'/deps',s(p.dependencies));f.writeFileSync(process.env.RUNNER_TEMP+'/devdeps',s(p.devDependencies));
          NODE
          "$NPM10" install --package-lock-only --force --ignore-scripts --no-audit --no-fund
          cmp -s package.json "$RUNNER_TEMP/package.before"
          mapfile -t files < <(git diff --name-only); test "${#files[@]}" -eq 1; test "${files[0]}" = package-lock.json
          node - <<'NODE'
          const f=require('fs'),p=JSON.parse(f.readFileSync('package.json')),l=JSON.parse(f.readFileSync('package-lock.json')),s=x=>JSON.stringify(Object.fromEntries(Object.entries(x||{}).sort(([a],[b])=>a.localeCompare(b))));if(l.lockfileVersion!==3)throw Error('LOCKFILE_VERSION');const r=l.packages?.[''];if(!r||s(r.dependencies)!==s(p.dependencies)||s(r.devDependencies)!==s(p.devDependencies)||s(p.dependencies)!==f.readFileSync(process.env.RUNNER_TEMP+'/deps','utf8')||s(p.devDependencies)!==f.readFileSync(process.env.RUNNER_TEMP+'/devdeps','utf8'))throw Error('DIRECT_DEPS_CHANGED');for(const x of Object.values(l.packages||{})){if(!x?.resolved)continue;const u=new URL(x.resolved);if(u.protocol!=='https:'||u.hostname!=='registry.npmjs.org'||u.username||u.password)throw Error('REGISTRY_URL')}if(/(_authToken|x-access-token|authorization\s*["']?\s*:|Bearer\s+|npm_[A-Za-z0-9]{20,})/i.test(f.readFileSync('package-lock.json','utf8')))throw Error('CREDENTIAL_CONTENT');
          NODE
          read -r adds dels _ < <(git diff --numstat -- package-lock.json)
          rm -rf node_modules
          "$NPM10" ci --force --no-audit --no-fund
          test_output="$RUNNER_TEMP/tests.log"; "$NPM10" run test:integration-settings | tee "$test_output"
          tests="$(grep -Eo '[0-9]+ tests? passed' "$test_output" | tail -1 | grep -Eo '[0-9]+' || true)"
          ./node_modules/.bin/prisma generate
          ./node_modules/.bin/prisma generate --schema prisma/integration-settings.schema.prisma
          "$NPM10" run typecheck:communication-runtime
          "$NPM10" run typecheck:integration-release
          cmp -s package.json "$RUNNER_TEMP/package.before"
          mapfile -t files < <(git diff --name-only); test "${#files[@]}" -eq 1; test "${files[0]}" = package-lock.json
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json; git commit -m 'Repair package lock consistency'; new_sha="$(git rev-parse HEAD)"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"; header="AUTHORIZATION: basic $auth"
          git -c http.https://github.com/.extraheader="$header" fetch origin "$TARGET_BRANCH" --no-tags
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_TARGET_SHA"
          git -c http.https://github.com/.extraheader="$header" push origin "HEAD:refs/heads/$TARGET_BRANCH"
          { echo old_sha="$old_sha"; echo new_sha="$new_sha"; echo additions="${adds:-0}"; echo deletions="${dels:-0}"; echo tests_count="${tests:-UNAVAILABLE}"; } >> "$GITHUB_OUTPUT"

      - name: Install Vercel CLI
        run: '"$NPM10" install --global vercel@56.1.0 --no-audit --no-fund'

      - id: preview
        name: Wait for automatic Vercel Preview on new SHA
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set +x
          set -Eeuo pipefail
          test -n "$VERCEL_TOKEN"
          for n in $(seq 1 120); do
            curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_TEAM_ID&limit=100" > "$RUNNER_TEMP/d.json"
            row="$(python3 - "$RUNNER_TEMP/d.json" '${{ steps.repair.outputs.new_sha }}' <<'PY'
          import json,sys
          ds=[d for d in json.load(open(sys.argv[1])).get('deployments',[]) if (d.get('meta') or {}).get('githubCommitSha')==sys.argv[2] and d.get('target')!='production']
          ds.sort(key=lambda d:d.get('created',0),reverse=True)
          print('NOT_FOUND||' if not ds else f"{ds[0].get('state')}|{ds[0].get('uid') or ds[0].get('id')}|{ds[0].get('url')}")
          PY
            )"
            IFS='|' read -r state id url <<< "$row"
            case "$state" in READY) echo id="$id" >> "$GITHUB_OUTPUT"; echo state=READY >> "$GITHUB_OUTPUT"; break;; ERROR|CANCELED) echo VERCEL_PREVIEW_BUILD_FAILED; exit 1;; esac
            sleep 10
          done
          test "${state:-}" = READY

      - id: bootstrap
        name: Run existing bootstrap and read-only checks
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SAFE_REPORT: ${{ runner.temp }}/vercel.md
        run: bash scripts/bootstrap-integration-settings-vercel-ci.sh

      - name: Publish sanitized report
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report="$RUNNER_TEMP/report.md"
          { echo '## Temporary Vercel integration bootstrap'; echo; echo '| Check | Result |'; echo '|---|---|'; echo '| Trigger | deployment_status |'; echo '| Old SHA | ${{ steps.repair.outputs.old_sha }} |'; echo '| New SHA | ${{ steps.repair.outputs.new_sha }} |'; echo '| package-lock additions | ${{ steps.repair.outputs.additions }} |'; echo '| package-lock deletions | ${{ steps.repair.outputs.deletions }} |'; echo '| npm ci | success |'; echo '| Integration tests | success (${{ steps.repair.outputs.tests_count }}) |'; echo '| Prisma generations | success |'; echo '| Typechecks | success |'; echo '| Preview ID | ${{ steps.preview.outputs.id }} |'; echo '| Preview state | ${{ steps.preview.outputs.state }} |'; echo '| GitHub deterministic checks | PASS |'; echo '| Vercel production build gate | PASS |'; echo '| Bootstrap/read-only checks | ${{ steps.bootstrap.outcome }} |'; } > "$report"
          if [[ -f "$RUNNER_TEMP/vercel.md" ]]; then tail -n +5 "$RUNNER_TEMP/vercel.md" >> "$report"; fi
          gh pr comment 127 --repo AdhamRef/gozbebekleri --body-file "$report"
          test "${{ steps.preview.outcome }}" = success
          test "${{ steps.bootstrap.outcome }}" = success
