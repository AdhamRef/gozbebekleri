name: Temporary Vercel integration bootstrap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/temporary-vercel-integration-bootstrap.yml]

concurrency:
  group: temporary-vercel-integration-bootstrap
  cancel-in-progress: false

env:
  TARGET_PR_NUMBER: 146
  TARGET_BRANCH: release/integration-settings-final
  EXPECTED_TARGET_SHA: ddebd7a1521b8686c5c4cc7e4b8b8445872b65b1
  VERCEL_PROJECT_ID: prj_hkMyu8iABc7AAqF7T1DvYRpKYRqV
  VERCEL_TEAM_ID: team_zLLO1Hql8hFDCswcnpMMDCBj

jobs:
  bootstrap:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Trigger final integration settings bootstrap'))
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions: {contents: read, issues: write, pull-requests: write}
    steps:
      - id: checkout
        name: Checkout target branch
        env: {GITHUB_TOKEN: '${{ github.token }}'}
        run: |
          set +x; set -Eeuo pipefail
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          git init
          git remote add origin https://github.com/AdhamRef/gozbebekleri.git
          h="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="$h" fetch --no-tags --depth=1 origin "refs/heads/$TARGET_BRANCH"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"

      - id: safety
        name: Verify target PR safety gates before npm
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set +x; set -Eeuo pipefail
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/AdhamRef/gozbebekleri/pulls/$TARGET_PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          python3 - "$RUNNER_TEMP/pr.json" "$TARGET_PR_NUMBER" "$TARGET_BRANCH" "$EXPECTED_TARGET_SHA" <<'PY'
          import json,subprocess,sys
          p=json.load(open(sys.argv[1])); h=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert p.get('number')==int(sys.argv[2]) and p.get('state')=='open' and p.get('draft') is True and p['head']['ref']==sys.argv[3] and p['head']['sha']==sys.argv[4] and h==sys.argv[4], 'TARGET_PR_MOVED'
          PY
          rm -f "$RUNNER_TEMP/pr.json"

      - id: node
        name: Use Node 22
        uses: actions/setup-node@v4
        with: {node-version: 22}

      - id: npm
        name: Pin npm 10.9.2
        run: |
          npm install --prefix "$RUNNER_TEMP/npm-tool" npm@10.9.2 --ignore-scripts --no-audit --no-fund
          echo "NPM10=node $RUNNER_TEMP/npm-tool/node_modules/npm/bin/npm-cli.js" >> "$GITHUB_ENV"
          test "$(node "$RUNNER_TEMP/npm-tool/node_modules/npm/bin/npm-cli.js" --version)" = 10.9.2

      - id: lockfile
        name: Validate package lock stability
        run: |
          cp package.json "$RUNNER_TEMP/p"; cp package-lock.json "$RUNNER_TEMP/l"
          $NPM10 install --package-lock-only --force --ignore-scripts --no-audit --no-fund
          cmp -s package.json "$RUNNER_TEMP/p"
          cmp -s package-lock.json "$RUNNER_TEMP/l"
          test -z "$(git status --porcelain)"

      - id: ci
        name: Install dependencies with npm ci
        run: rm -rf node_modules && $NPM10 ci --force --no-audit --no-fund

      - id: tests
        name: Run Integration Settings tests
        run: $NPM10 run test:integration-settings

      - id: prisma_default
        name: Generate default Prisma client
        run: ./node_modules/.bin/prisma generate

      - id: prisma_integration
        name: Generate Integration Settings Prisma client
        run: ./node_modules/.bin/prisma generate --schema prisma/integration-settings.schema.prisma

      - id: runtime_typecheck
        name: Run communication runtime typecheck
        run: $NPM10 run typecheck:communication-runtime

      - id: release_typecheck
        name: Run integration release typecheck
        run: $NPM10 run typecheck:integration-release

      - id: head
        name: Verify feature SHA
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_SHA"

      - id: preview
        name: Verify matching Vercel Preview is READY
        env: {VERCEL_TOKEN: '${{ secrets.VERCEL_TOKEN }}'}
        run: |
          set +x; set -Eeuo pipefail
          curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_TEAM_ID&limit=100" > "$RUNNER_TEMP/deployments.json"
          python3 - "$RUNNER_TEMP/deployments.json" "$EXPECTED_TARGET_SHA" >> "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          rows=[d for d in json.load(open(sys.argv[1])).get('deployments',[]) if (d.get('meta') or {}).get('githubCommitSha')==sys.argv[2] and d.get('target')!='production']
          rows.sort(key=lambda d:d.get('created',0),reverse=True)
          assert rows and rows[0].get('state')=='READY','PREVIEW_NOT_READY'
          print('id='+str(rows[0].get('uid') or rows[0].get('id'))); print('state=READY')
          PY
          rm -f "$RUNNER_TEMP/deployments.json"

      - id: readonly
        name: Resolve project env records and run read-only checks securely
        env: {VERCEL_TOKEN: '${{ secrets.VERCEL_TOKEN }}'}
        run: |
          set +x; set -Eeuo pipefail; umask 077
          d="$(mktemp -d)"
          trap 'rm -rf "$d"' EXIT

          api_error() {
            node - "$1" <<'NODE'
          const fs=require('fs'); let code='UNKNOWN';
          try { const b=JSON.parse(fs.readFileSync(process.argv[2],'utf8')); const c=b?.error?.code ?? b?.code; if(typeof c==='string'&&/^[A-Z0-9_.-]{1,80}$/i.test(c)) code=c; } catch {}
          process.stdout.write(code);
          NODE
          }
          fail() { echo "blocker=$1" >> "$GITHUB_OUTPUT"; echo "$1"; exit 1; }

          http="$(curl -sS -o "$d/list.json" -w '%{http_code}' -H "Authorization: Bearer $VERCEL_TOKEN" -H 'Accept: application/json' --get "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env" --data-urlencode "teamId=$VERCEL_TEAM_ID")"
          chmod 600 "$d/list.json"
          [[ "$http" == 200 ]] || fail "VERCEL_ENV_LIST_HTTP_${http}_$(api_error "$d/list.json")"

          node - "$d/list.json" "$TARGET_BRANCH" "$d/manifest.json" <<'NODE'
          const fs=require('fs'); const [listPath,branch,out]=process.argv.slice(2);
          const body=JSON.parse(fs.readFileSync(listPath,'utf8')); const records=Array.isArray(body)?body:(body.envs||body.data||[]);
          const required=['DATABASE_URL','CRON_SECRET','INTEGRATION_SETTINGS_ENCRYPTION_KEY']; const canonical=['APP_URL','NEXTAUTH_URL','NEXT_PUBLIC_APP_URL','NEXT_PUBLIC_SITE_URL'];
          const targets=(r,t)=>{const x=Array.isArray(r.target)?r.target:[r.target];return x.includes(t)||x.includes('all')};
          const time=r=>Number(r.updatedAt||r.createdAt||r.updated||r.created||0);
          function pick(key,target){const c=records.filter(r=>r?.key===key&&r?.id&&targets(r,target));c.sort((a,b)=>{const ar=target==='preview'?(a.gitBranch===branch?2:(!a.gitBranch?1:0)):(!a.gitBranch?1:0);const br=target==='preview'?(b.gitBranch===branch?2:(!b.gitBranch?1:0)):(!b.gitBranch?1:0);return br-ar||time(b)-time(a)});const r=c.find(x=>target!=='preview'||x.gitBranch===branch||!x.gitBranch);return r?{key:r.key,id:r.id}:null}
          function resolve(target){const s={};for(const k of required){const r=pick(k,target);if(!r)throw Error(k+'_MISSING_FOR_'+target.toUpperCase());s[k]=r}for(const k of canonical){const r=pick(k,target);if(r){s[k]=r;break}}if(!canonical.some(k=>s[k]))throw Error('CANONICAL_URL_MISSING_FOR_'+target.toUpperCase());return s}
          try{fs.writeFileSync(out,JSON.stringify({preview:resolve('preview'),production:resolve('production')}),{mode:0o600})}catch(e){console.error(e.message);process.exit(2)}
          NODE
          manifest_status=$?
          [[ $manifest_status -eq 0 ]] || fail ENV_RECORD_SELECTION_FAILED
          chmod 600 "$d/manifest.json"

          node - "$d/manifest.json" <<'NODE' > "$d/records.tsv"
          const fs=require('fs'),m=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));for(const scope of ['preview','production'])for(const r of Object.values(m[scope]))console.log([scope,r.key,r.id].join('\t'));
          NODE
          chmod 600 "$d/records.tsv"

          while IFS=$'\t' read -r scope key id; do
            file="$d/${scope}-${key}.json"
            http="$(curl -sS -o "$file" -w '%{http_code}' -H "Authorization: Bearer $VERCEL_TOKEN" -H 'Accept: application/json' --get "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/env/$id" --data-urlencode "teamId=$VERCEL_TEAM_ID" --data-urlencode 'decrypt=true' --data-urlencode 'source=vercel-cli:pull')"
            chmod 600 "$file"
            [[ "$http" == 200 ]] || fail "VERCEL_ENV_RECORD_HTTP_${http}_$(api_error "$file")_${key}_${scope}"
          done < "$d/records.tsv"

          cat > "$d/run.js" <<'NODE'
          const fs=require('fs'),{spawnSync}=require('child_process');const [dir,scope,script,log]=process.argv.slice(2),m=JSON.parse(fs.readFileSync(dir+'/manifest.json','utf8'))[scope];
          const env={PATH:process.env.PATH,HOME:process.env.HOME,LANG:process.env.LANG||'C.UTF-8',CI:'true',NODE_ENV:'production',VERCEL_ENV:scope};
          for(const r of Object.values(m)){const b=JSON.parse(fs.readFileSync(`${dir}/${scope}-${r.key}.json`,'utf8'));const v=typeof b?.value==='string'?b.value:(typeof b?.env?.value==='string'?b.env.value:null);if(v===null){console.error(r.key+'_VALUE_UNAVAILABLE_FOR_'+scope.toUpperCase());process.exit(3)}env[r.key]=v}
          const fd=fs.openSync(log,'w',0o600),x=spawnSync('npm',['run',script],{cwd:process.cwd(),env,stdio:['ignore',fd,fd]});fs.closeSync(fd);if(x.error)process.exit(4);process.exit(x.status??1);
          NODE
          chmod 600 "$d/run.js"

          set +e
          node "$d/run.js" "$d" preview preflight:integration-settings "$d/preflight.log"; preflight_exit=$?
          node "$d/run.js" "$d" production verify:integration-settings-migration "$d/migration.log"; migration_exit=$?
          set -e

          preflight="$(grep -Eo 'INTEGRATION SETTINGS PREFLIGHT: (PASS|WARNING|BLOCKED)' "$d/preflight.log"|tail -1|awk '{print $4}'||true)"
          migration="$(grep -Eo 'MIGRATION STATUS: (FULLY_APPLIED|PARTIALLY_APPLIED|NOT_APPLIED|UNKNOWN)' "$d/migration.log"|tail -1|awk '{print $3}'||true)"
          echo "preflight=$preflight" >> "$GITHUB_OUTPUT"; echo "migration=$migration" >> "$GITHUB_OUTPUT"

          [[ "$preflight" == PASS || "$preflight" == WARNING ]] || fail "PREFLIGHT_BLOCKED_EXIT_${preflight_exit}"
          [[ "$migration" == NOT_APPLIED || "$migration" == PARTIALLY_APPLIED || "$migration" == FULLY_APPLIED ]] || fail "MIGRATION_VERIFY_BLOCKED_EXIT_${migration_exit}"

      - name: Publish sanitized result
        if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          r="$RUNNER_TEMP/result.md"; printf '## Temporary Vercel integration bootstrap\n\n| Check | Result |\n|---|---|\n' > "$r"
          echo '| Run ID | ${{ github.run_id }} |' >> "$r"
          echo '| Preview | ${{ steps.preview.outputs.id }} / ${{ steps.preview.outputs.state }} |' >> "$r"
          echo '| Read-only checks | ${{ steps.readonly.outcome }} |' >> "$r"
          echo '| Preflight | ${{ steps.readonly.outputs.preflight }} |' >> "$r"
          echo '| Migration verify | ${{ steps.readonly.outputs.migration }} |' >> "$r"
          echo '| Blocker | ${{ steps.readonly.outputs.blocker }} |' >> "$r"
          gh pr comment "$TARGET_PR_NUMBER" --repo AdhamRef/gozbebekleri --body-file "$r"
          test '${{ steps.readonly.outcome }}' = success
