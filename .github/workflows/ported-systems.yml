name: Transferred systems verification
on:
  push:
    branches: [port/minber-systems-20261104, integration/unified-systems-20261107, integration/goz-finance-security-rc-20261109, fix/goz-stripe-qa-react-server-20261109, fix/goz-guest-charge-binding-signed-http-20261110, fix/goz-stripe-intent-recovery-20261110, review/goz-stripe-finance-qa-rc-20261110]
  pull_request:
    branches: [main, integration/unified-systems-20261107, fix/goz-report-profile-settlement-20261108, audit/goz-parity-finance-20261109, audit/goz-round2-idempotency-locale-20261109, integration/goz-finance-security-rc-20261109]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ported-systems-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      DATABASE_URL: mongodb://127.0.0.1:27018/ported_systems_fixture?serverSelectionTimeoutMS=500&connectTimeoutMS=500
      NEXTAUTH_URL: http://127.0.0.1:3106
      APP_URL: https://fixture.example
      NEXT_PUBLIC_SITE_URL: https://fixture.example
      NEXTAUTH_SECRET: isolated-build-fixture-not-a-deployment-secret
      GOOGLE_CLIENT_ID: fixture-client
      GOOGLE_CLIENT_SECRET: fixture-secret
      STRIPE_SECRET_KEY: sk_test_fixture_no_network
    steps:
      - name: Check out the exact event commit (read-only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - name: Install from committed lockfile without scripts
        run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Validate schemas and generate institution-local clients
        run: |
          npx --no-install prisma validate --schema prisma/schema.prisma
          npx --no-install prisma generate --schema prisma/schema.prisma
          npx --no-install prisma generate --schema prisma/integration-settings.schema.prisma
      - name: Check transferred runtime TypeScript
        run: npm run typecheck:ported-systems
      - name: Run offline, synthetic system regressions
        run: npm run test:ported-systems
      - name: Install isolated Mongo replica for DB-backed build and signed payment checks
        run: npm install --no-save --package-lock=false --ignore-scripts --legacy-peer-deps --no-audit --no-fund mongodb-memory-server@10.1.4
      - name: Compile Next routes with reachable isolated MongoDB, reject ignored DB errors
        run: node scripts/qa-build-with-isolated-mongo.mjs
      - name: Mandatory signed Stripe refund HTTP and MongoDB transaction regressions
        run: |
          DATABASE_URL=mongodb://127.0.0.1:27018/isolated_refunds npx --no-install prisma generate --schema prisma/schema.prisma
          # The Stripe HTTP fixture imports server-only modules under Node; select
          # React's server export condition without changing application security boundaries.
          node --conditions=react-server --import tsx scripts/qa-stripe-signed-http-isolated.mjs
          node --conditions=react-server --import tsx scripts/qa-stripe-guest-charge-http-isolated.mjs
          node --conditions=react-server --import tsx scripts/qa-receipt-http-isolated.mjs
          node --conditions=react-server --import tsx scripts/qa-donation-access-http-isolated.mjs
