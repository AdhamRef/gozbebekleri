name: Secure media caller codemod

on:
  push:
    branches:
      - agent/secure-media-upload-delete
    paths:
      - scripts/secure-media-callers.mjs
      - .github/workflows/secure-media-callers.yml

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/secure-media-upload-delete
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/secure-media-callers.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No caller changes required"
          else
            git commit -m "Migrate dashboard media callers"
            git push origin HEAD:agent/secure-media-upload-delete
          fi
