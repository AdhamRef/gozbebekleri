name: Security GET guest capability HTTP
on:
  push:
    branches: [hotfix/donation-get-guest-receipt-auth-20261111]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-get:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: mongodb://127.0.0.1:27018/get_guest_fixture
      NEXTAUTH_SECRET: synthetic-only
      STRIPE_SECRET_KEY: sk_test_fixture_no_network
      GOOGLE_CLIENT_ID: fixture-client
      GOOGLE_CLIENT_SECRET: fixture-secret
    steps:
      - name: Fetch exact SHA archive (main contains legacy invalid gitlink)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN" |
            curl --fail --silent --show-error --location --config - \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" --output source.tgz
          tar -xzf source.tgz --strip-components=1
          rm source.tgz
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Guest GET authorization, field allowlist, read-only HTTP regression
        run: node --conditions=react-server --import tsx scripts/qa-donation-get-guest-http-isolated.mjs
      - name: Cryptographic guest grant checks
        run: node --conditions=react-server --import tsx scripts/qa-guest-receipt-capability.mjs
