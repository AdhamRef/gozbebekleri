name: Temporary bootstrap one-shot dispatcher

on:
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create marker and dispatch bootstrap
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: AdhamRef/gozbebekleri
          MARKER_TAG: temporary-bootstrap-dispatch-20260715
          WORKFLOW_FILE: temporary-vercel-integration-bootstrap.yml
          TARGET_PR: '127'
        run: |
          set -Eeuo pipefail

          ERROR_LOG="$RUNNER_TEMP/dispatcher-error.log"
          REPORT_FILE="$RUNNER_TEMP/dispatcher-report.md"
          rm -f "$ERROR_LOG" "$REPORT_FILE"
          cleanup() {
            rm -f "$ERROR_LOG" "$REPORT_FILE"
          }
          trap cleanup EXIT

          if gh api "repos/$REPOSITORY/git/ref/tags/$MARKER_TAG" >/dev/null 2>&1; then
            echo "ALREADY_DISPATCHED" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          MAIN_SHA="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha' 2>"$ERROR_LOG")"
          if [[ -z "$MAIN_SHA" ]]; then
            CLASSIFICATION="UNKNOWN_DISPATCH_FAILURE"
            echo "$CLASSIFICATION" >> "$GITHUB_STEP_SUMMARY"
            printf '## Temporary bootstrap dispatcher\n\nResult: `%s`\n' "$CLASSIFICATION" > "$REPORT_FILE"
            gh pr comment "$TARGET_PR" --repo "$REPOSITORY" --body-file "$REPORT_FILE" >/dev/null 2>&1 || true
            exit 1
          fi

          if ! gh api --method POST "repos/$REPOSITORY/git/refs" \
            -f ref="refs/tags/$MARKER_TAG" \
            -f sha="$MAIN_SHA" >/dev/null 2>"$ERROR_LOG"; then
            CLASSIFICATION="UNKNOWN_DISPATCH_FAILURE"
            if grep -Eqi '403|forbidden|resource not accessible|permission' "$ERROR_LOG"; then
              CLASSIFICATION="ACTIONS_PERMISSION_DENIED"
            fi
            echo "$CLASSIFICATION" >> "$GITHUB_STEP_SUMMARY"
            printf '## Temporary bootstrap dispatcher\n\nResult: `%s`\n' "$CLASSIFICATION" > "$REPORT_FILE"
            gh pr comment "$TARGET_PR" --repo "$REPOSITORY" --body-file "$REPORT_FILE" >/dev/null 2>&1 || true
            exit 1
          fi

          set +e
          gh workflow run "$WORKFLOW_FILE" \
            --repo "$REPOSITORY" \
            --ref main >/dev/null 2>"$ERROR_LOG"
          DISPATCH_EXIT=$?
          set -e

          if [[ $DISPATCH_EXIT -eq 0 ]]; then
            echo "DISPATCH_ACCEPTED" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          CLASSIFICATION="UNKNOWN_DISPATCH_FAILURE"
          if grep -Eqi 'workflow.*not found|could not find.*workflow|404|not found' "$ERROR_LOG"; then
            CLASSIFICATION="WORKFLOW_NOT_FOUND"
          elif grep -Eqi '403|forbidden|resource not accessible|permission' "$ERROR_LOG"; then
            CLASSIFICATION="ACTIONS_PERMISSION_DENIED"
          elif grep -Eqi '422|workflow_dispatch|dispatch.*rejected|unprocessable' "$ERROR_LOG"; then
            CLASSIFICATION="WORKFLOW_DISPATCH_REJECTED"
          fi

          echo "$CLASSIFICATION" >> "$GITHUB_STEP_SUMMARY"
          printf '## Temporary bootstrap dispatcher\n\nResult: `%s`\n' "$CLASSIFICATION" > "$REPORT_FILE"
          gh pr comment "$TARGET_PR" --repo "$REPOSITORY" --body-file "$REPORT_FILE" >/dev/null 2>&1 || true
          exit 1
